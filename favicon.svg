<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient for high contrast in any browser tab -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Hands Gradient (Original Déio theme: luminous indigo to light violet) -->
    <linearGradient id="handsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Globe Glow Radial Gradient -->
    <radialGradient id="globeGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid / Globe Border Gradient -->
    <linearGradient id="globeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#4f46e5" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Holographic Globe Radial Glow (Original Déio Informática) -->
  <circle cx="64" cy="52" r="34" fill="url(#globeGlow)" />

  <!-- Globe Outer Circle -->
  <circle cx="64" cy="52" r="28" fill="none" stroke="url(#globeRingGrad)" stroke-width="2.5" />

  <!-- Globe Meridians and Parallels -->
  <ellipse cx="64" cy="52" rx="14" ry="28" fill="none" stroke="url(#globeRingGrad)" stroke-width="2" />
  <ellipse cx="64" cy="52" rx="27" ry="9" fill="none" stroke="url(#globeRingGrad)" stroke-width="1.8" stroke-dasharray="3 1" stroke-opacity="0.8" />
  <line x1="36" y1="52" x2="92" y2="52" stroke="url(#globeRingGrad)" stroke-width="2" />
  <path d="M42 38 Q 64 44, 86 38" fill="none" stroke="url(#globeRingGrad)" stroke-width="1.8" stroke-opacity="0.9" />
  <path d="M42 66 Q 64 60, 86 66" fill="none" stroke="url(#globeRingGrad)" stroke-width="1.8" stroke-opacity="0.9" />

  <!-- Glowing Core Star at North Pole / Intersection -->
  <circle cx="64" cy="52" r="3" fill="#ffffff" />
  <circle cx="64" cy="52" r="5" fill="#38bdf8" fill-opacity="0.6" />

  <!-- Hands Cradling the Globe ("O mundo em suas mãos") -->
  <!-- Upper Hand Contour -->
  <path d="M26 104 Q 40 82, 64 86 T 102 104" fill="none" stroke="url(#handsGrad)" stroke-linecap="round" stroke-width="4.5" />
  <!-- Lower Hand Arc -->
  <path d="M20 114 Q 38 92, 64 97 T 108 114" fill="none" stroke="url(#handsGrad)" stroke-linecap="round" stroke-width="5" />
  <!-- Fingertip Tech Nodes -->
  <circle cx="26" cy="104" r="3" fill="#a5b4fc" />
  <circle cx="102" cy="104" r="3" fill="#a5b4fc" />
  <circle cx="20" cy="114" r="3.5" fill="#818cf8" />
  <circle cx="108" cy="114" r="3.5" fill="#818cf8" />
</svg>
